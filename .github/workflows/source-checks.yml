name: Source checks
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - run: npm ci --ignore-scripts
    - run: npm run build
    - run: npm test
    - name: Check dependency advisories
      run: npm audit --audit-level=high
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-latest
        - macos-15
